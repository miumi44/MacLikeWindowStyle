name: macOS build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run regression tests
        run: ./scripts/test-windowbridge.sh
      - name: Build and verify app
        run: ./scripts/build-windowbridge.sh
